[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888

# Homepage only. Other routes stay HTML so they are not replaced by this profile.
[[edge_functions]]
  function = "agent-markdown"
  path = "/"

# CRITICAL SEO: 301 redirects to preserve rankings
# These redirects ensure your current Google rankings are maintained
# Add any URL changes here to maintain SEO value

# Preserve existing URL structures (add specific redirects if URLs change)
# Example: if you change /old-page to /new-page, add:
# [[redirects]]
#   from = "/old-page"
#   to = "/new-page"
#   status = 301

# Studio redirects (for Sanity CMS)
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

# Blog lived at /journal; routes are now /writing
[[redirects]]
  from = "/journal"
  to = "/writing"
  status = 301

[[redirects]]
  from = "/journal/*"
  to = "/writing/:splat"
  status = 301

# Playground lived at /experiments, then briefly at /playgrounds
[[redirects]]
  from = "/experiments"
  to = "/playground"
  status = 301
  force = true

[[redirects]]
  from = "/experiments/*"
  to = "/playground/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/playgrounds"
  to = "/playground"
  status = 301
  force = true

[[redirects]]
  from = "/playgrounds/*"
  to = "/playground/:splat"
  status = 301
  force = true

# Avatar chat. Must stay above the catch-all so the function is reached.
[[redirects]]
  from = "/api/avatar"
  to = "/.netlify/functions/avatar-chat"
  status = 200
  force = true

# Training diary. The path suffix selects connect, callback, or the diary.
[[redirects]]
  from = "/api/strava/connect"
  to = "/.netlify/functions/strava-diary/connect"
  status = 200
  force = true

[[redirects]]
  from = "/api/strava/callback"
  to = "/.netlify/functions/strava-diary/callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/strava/diary"
  to = "/.netlify/functions/strava-diary/diary"
  status = 200
  force = true

# No site-wide rewrite to /index.html. This is a static site, and that rule
# was serving the homepage for any page missing from the last build, including
# /playground/training during netlify dev. Unknown URLs use the built 404 page.

